server.document-root = "/var/www/localhost/htdocs"
server.port = 80
server.bind = "0.0.0.0"

server.modules = (
  "mod_access",
  "mod_alias",
  "mod_setenv",
  "mod_cgi"
)

# Route all requests to git-http-backend.
# The alias replaces the URL prefix with the path to the CGI binary;
# lighttpd then passes the remainder as PATH_INFO automatically.
alias.url = (
  "/" => "/usr/libexec/git-core/git-http-backend/"
)

# Treat any file served under the alias as a CGI executable.
# The empty-string mapping means "execute the file at this path as CGI".
cgi.assign = (
  "" => ""
)

# CGI environment variables for git-http-backend and hooks.
#
# This include file is generated at runtime by entrypoint.sh from container
# environment variables. It contains:
#   - GIT_PROJECT_ROOT, GIT_HTTP_EXPORT_ALL (required by git-http-backend)
#   - AUTH_CALLBACK_URL, DAEMON_HTTP_PORT, REPOS_PATH (required by pre-receive hook)
#
# Container env vars are NOT automatically inherited by CGI processes, so we
# must inject them explicitly via setenv.add-environment.
include "/etc/lighttpd/env.conf"

# lighttpd's mod_cgi follows RFC 3875: all HTTP request headers are passed
# to CGI scripts as environment variables with the HTTP_ prefix, uppercased,
# dashes replaced with underscores. For example:
#   X-Symbiotic-Push-Session: abc123
# becomes:
#   HTTP_X_SYMBIOTIC_PUSH_SESSION=abc123
#
# git-http-backend preserves the full CGI environment for hooks
# (pre-receive, update, post-receive). The pre-receive hook can therefore
# read $HTTP_X_SYMBIOTIC_PUSH_SESSION to identify the push session.
