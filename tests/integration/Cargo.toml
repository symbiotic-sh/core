[package]
name = "symbiotic-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Cross-crate integration tests.
# Each file in tests/ covers a major end-to-end flow.

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait.workspace = true
tempfile.workspace = true
url.workspace = true

symbiotic-core = { path = "../../crates/symbiotic-core" }
symbiotic-intake = { path = "../../crates/symbiotic-intake" }
symbiotic-archive = { path = "../../crates/symbiotic-archive" }
symbiotic-firewall = { path = "../../crates/symbiotic-firewall" }
symbiotic-context = { path = "../../crates/symbiotic-context" }
symbiotic-queue = { path = "../../crates/symbiotic-queue" }
symbiotic-agents = { path = "../../crates/symbiotic-agents" }
symbiotic-trust = { path = "../../crates/symbiotic-trust" }
symbiotic-domains = { path = "../../crates/symbiotic-domains" }

[[test]]
name = "intake_to_recall"
path = "tests/intake_to_recall.rs"

[[test]]
name = "trust_and_agents"
path = "tests/trust_and_agents.rs"

[[test]]
name = "queue_lifecycle"
path = "tests/queue_lifecycle.rs"

[[test]]
name = "goal_workflow"
path = "tests/goal_workflow.rs"
